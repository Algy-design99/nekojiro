name: Update Nekojiro news
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - '.github/workflows/update-nekojiro-news.yml'
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
permissions:
  contents: write
concurrency:
  group: nekojiro-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate fresh RSS
        run: |
          date -u '+Workflow UTC start: %Y-%m-%dT%H:%M:%SZ'
          python scripts/update_news.py
          python -m json.tool news/latest.json > /dev/null
      - name: Commit generated JSON with push retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/latest.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update fresh news feed"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push conflict; retry $i"
            git fetch origin main
            git rebase origin/main || exit 1
            sleep $((i * 3))
          done
          exit 1
