name: Build and publish managed articles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['content/**', 'scripts/content-build.py', '.github/workflows/content-publish.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: managed-content-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve existing articles and render published content
        run: python scripts/content-build.py
      - name: Save generated articles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content board/catalog.json board/feed.xml board/index.html work living food travel craft
          if ! git diff --cached --quiet; then
            git commit -m 'Build managed article pages and indexes'
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git pull --rebase origin main || exit 1
              if [ "$i" = 5 ]; then exit 1; fi
              sleep 3
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deploy
