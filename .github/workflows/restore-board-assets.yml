name: Restore board assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['board/assets-source.json', 'board/threads.json.gz', 'scripts/restore_board_assets.py', '.github/workflows/restore-board-assets.yml']
permissions:
  contents: write
concurrency:
  group: restore-board-assets
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.0.0
      - run: python scripts/restore_board_assets.py
      - name: Save recovered files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add board/assets board/threads.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve recovered board images and plain JSON fallback'
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase origin main || exit 1
            sleep 3
          done
          exit 1
