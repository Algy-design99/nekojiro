name: Update Nekojiro Economy news
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_economy.py'
      - '.github/workflows/update-nekojiro-economy.yml'
  schedule:
    - cron: '9,19,29,39,49,59 * * * *'
permissions:
  contents: write
concurrency:
  group: nekojiro-economy-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect economy RSS
        run: |
          python scripts/update_economy.py
          python -m json.tool news/economy.json > /dev/null
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news/economy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update economy news feed'
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep $((i*3))
          done
          exit 1
