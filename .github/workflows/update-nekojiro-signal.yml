name: Update Nekojiro Signal news
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_signal.py'
      - '.github/workflows/update-nekojiro-signal.yml'
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
concurrency:
  group: nekojiro-signal-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch domestic and world RSS
        run: |
          python scripts/update_signal.py
          python -m json.tool news/signal.json > /dev/null
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/signal.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Signal news"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep $((i*3))
          done
          exit 1
