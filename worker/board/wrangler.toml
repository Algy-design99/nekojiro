name = "nekojiro-board-posts"
main = "index.mjs"
compatibility_date = "2026-11-14"
workers_dev = true

[[durable_objects.bindings]]
name = "BOARD"
class_name = "BoardRoom"

[[migrations]]
tag = "v1"
